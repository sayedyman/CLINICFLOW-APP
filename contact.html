<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Healthcare App</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f9fa; /* Soft background */
            --card-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1a202c;
            --text-secondary: #718096;
            --accent-color: #0d9488;
            --accent-bg: #e6fffa;
            --border-color: #edf2f7;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.08);
            --border-radius: 20px;
            --toggle-bg: #cbd5e0;
            --input-bg: #f8fafc;
            --input-focus: #ffffff;
            --item-hover: #f1f5f9;
            --icon-bg: #f1f5f9;
            --error-bg: #fff5f5;
            
            --hero-bg: #4a5568; /* Charcoal matching wireframe */
            --hero-text: #ffffff;
            --btn-bg: #2d3748;
            --btn-text: #ffffff;
        }

        .dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --header-bg: rgba(30, 30, 30, 0.85);
            --text-main: #e2e8f0;
            --text-secondary: #a0aec0;
            --accent-color: #14b8a6;
            --accent-bg: #2d3748;
            --border-color: #2d3748;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.6);
            --toggle-bg: #4a5568;
            --input-bg: #1a202c;
            --input-focus: #2d3748;
            --item-hover: #2d3748;
            --icon-bg: #2d3748;
            --error-bg: #3c1a1a;
            
            --hero-bg: #2d3748;
            --hero-text: #ffffff;
            --btn-bg: #4a5568;
            --btn-text: #ffffff;
        }

        body, .mobile-container, .header, .contact-form, .time-box, .hero-card, .hero-footer, .form-input, .primary-btn {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px; 
            min-height: 100vh; 
            background-color: var(--bg-color);
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }

        .mobile-container::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Header Layout exactly mapping standard pages */
        .header {
            width: 100%;
            padding: 40px 20px 20px;
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            text-align: center;
            grid-column: 2;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            color: var(--text-main);
            grid-column: 1;
        }

        .back-btn:active {
            background: rgba(0,0,0,0.05);
        }

        html[dir="rtl"] .back-icon {
            transform: rotate(180deg);
        }

        .content {
            padding: 16px 20px 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Hero Card elements matching Wireframe */
        .hero-card {
            background: var(--hero-bg);
            color: var(--hero-text);
            border-radius: var(--border-radius);
            padding: 24px;
            text-align: start;
            box-shadow: var(--shadow-sm);
        }

        .hero-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero-desc {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .hero-footer {
            background: var(--border-color);
            border-radius: 12px;
            padding: 12px 14px 12px 20px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
        }
        
        .footer-icon-box {
            width: 32px;
            height: 32px;
            background: var(--card-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            box-shadow: var(--shadow-sm);
        }

        /* Form Container matching Wireframe */
        .contact-form {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            padding: 24px 20px;
            margin-top: 24px;
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            padding-inline-start: 4px;
        }
        
        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1.5px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            background: var(--input-bg);
            transition: all 0.2s;
        }
        
        .form-input::placeholder {
            color: #a0aec0;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }
        
        html[dir="rtl"] .form-input[type="email"] {
            direction: ltr;
            text-align: right;
        }

        .form-textarea {
            height: 120px;
            padding: 16px;
            resize: none;
        }
        
        .input-error {
            border-color: #e53e3e !important;
            background: var(--error-bg) !important;
        }

        .primary-btn {
            width: 100%;
            height: 52px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .primary-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Extra Links Area (Matching the layout visually with rounded box boxes) */
        .time-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        
        .time-box:last-child {
            margin-bottom: 0;
        }
        
        .time-box:active {
            background-color: var(--item-hover);
            transform: scale(0.99);
        }
        
        .time-box-content {
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .time-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .time-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            direction: ltr; /* Always LTR to keep emails/phones readable */
        }
        
        .time-icon {
            width: 24px;
            height: 24px;
            color: var(--text-secondary);
            opacity: 0.8;
            pointer-events: none;
        }

        /* Toast Styling */
        .toast-notification {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #38a169;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            box-shadow: var(--shadow-md);
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            pointer-events: none;
        }

        .toast-notification.active {
            transform: translateY(0);
            opacity: 1;
        }

        @media (min-width: 481px) {
            body {
                padding: 1.25rem;
            }
            .mobile-container {
                height: 896px;
                max-height: 90vh;
                min-height: auto;
                box-shadow: var(--shadow-md);
                border-radius: 36px;
                border: 10px solid #1a202c;
                margin: auto;
            }
        }

    </style>
    <script src="theme.js"></script>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Header -->
        <header class="header">
            <a href="index.html" class="back-btn" aria-label="Go back">
                <svg class="back-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <h1 class="title" data-i18n="contact_us_form">تواصل معنا</h1>
        </header>

        <main class="content">
            
            <!-- Information Banner -->
            <div class="hero-card">
                <h2 class="hero-title" data-i18n="how_help">كيف يمكننا مساعدتك؟</h2>
                <p class="hero-desc" data-i18n="how_help_desc">نحن هنا لمساعدتك، لا تتردد في التواصل معنا في أي وقت. فريق خدمة العملاء لدينا متاح للإجابة على استفساراتكم.</p>
            </div>
            
            <!-- Quick Info Bar -->
            <div class="hero-footer">
                <div class="footer-icon-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <span data-i18n="response_time">سيتم الرد خلال 24 ساعة</span>
            </div>

            <!-- Form -->
            <div class="contact-form">
                <div class="form-group">
                    <label class="form-label" data-i18n="full_name">الاسم الكامل</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="Enter your full name" data-i18n-placeholder="enter_full_name">
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="email_address">البريد الإلكتروني</label>
                    <input type="email" class="form-input" id="emailInput" placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="message">الرسالة</label>
                    <textarea class="form-input form-textarea" id="msgInput" placeholder="Write your inquiry here..." data-i18n-placeholder="write_inquiry"></textarea>
                </div>
                <button class="primary-btn" onclick="sendMessage()" data-i18n="send_message">إرسال الرسالة</button>
            </div>

            <!-- Extra Contact Methods -->
            <div class="extra-contacts">
                <a href="tel:+966500000000" class="time-box">
                    <div class="time-box-content">
                        <div class="time-label" data-i18n="call_us">اتصل بنا</div>
                        <div class="time-value">+966 50 000 0000</div>
                    </div>
                    <svg class="time-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </a>
                
                <a href="mailto:support@clinicflow.com" class="time-box">
                    <div class="time-box-content">
                        <div class="time-label" data-i18n="email_us">البريد الإلكتروني</div>
                        <div class="time-value">support@clinicflow.com</div>
                    </div>
                    <svg class="time-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </a>
            </div>

        </main>
        
        <!-- Success Toast Notification -->
        <div id="successToast" class="toast-notification">
            <span data-i18n="msg_success_toast">Your message has been sent successfully</span>
        </div>
    </div>

    <!-- Translations mapping injection -->
    <script src="translations.js"></script>
    <script>
        function sendMessage() {
            const name = document.getElementById('nameInput');
            const email = document.getElementById('emailInput');
            const msg = document.getElementById('msgInput');
            let isValid = true;
            
            // Simple validation iteration mapping
            [name, email, msg].forEach(el => {
                // Check if empty dropping native whitespace
                if(!el.value.trim()) {
                    el.classList.add('input-error');
                    isValid = false;
                } else {
                    el.classList.remove('input-error');
                }
                
                // Remove error style instantly exactly upon next keyboard input stroke
                el.addEventListener('input', () => {
                    el.classList.remove('input-error');
                }, { once: true });
            });
            
            // Simulate network transit & notify on success constraints met
            if(isValid) {
                const toast = document.getElementById('successToast');
                toast.classList.add('active');
                
                setTimeout(() => {
                    toast.classList.remove('active');
                    // Reset fields gracefully mapping UI cleanup requirements
                    [name, email, msg].forEach(el => el.value = '');
                }, 3000);
            }
        }
    </script>
</body>
</html>
