<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاعدادات - Healthcare App</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <style>
        :root {
            --bg-color: #f7f9fa; /* Soft background */
            --card-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1a202c;
            --text-secondary: #718096;
            --accent-color: #0d9488; /* Soft medical teal */
            --accent-bg: #e6fffa;
            --border-color: #edf2f7;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.08);
            --border-radius: 16px;
            --input-bg: #f8fafc;
            --input-focus: #ffffff;
            --item-hover: #f8fafc;
            --icon-bg: #f1f5f9;
            --error-bg: #fff5f5;
            --error-active: #fed7d7;
        }

        .dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --header-bg: rgba(30, 30, 30, 0.85);
            --text-main: #e2e8f0;
            --text-secondary: #a0aec0;
            --accent-color: #14b8a6;
            --accent-bg: #2d3748;
            --border-color: #2d3748;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.6);
            --toggle-bg: #4a5568;
            --input-bg: #2d3748;
            --input-focus: #1e1e1e;
            --item-hover: #2d3748;
            --icon-bg: #2d3748;
            --error-bg: #3c1a1a;
            --error-active: #5c2020;
        }

        body, .mobile-container, .header, .profile-card, .card-group, .list-item, .form-input, .bottom-sheet-modal, .avatar-wrapper, .edit-avatar-btn, .logout-container {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        /* Mockup Container */
        .mobile-container {
            width: 100%;
            max-width: 480px; 
            min-height: 100vh; 
            background-color: var(--bg-color);
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }

        /* Webkit scrollbar for mockup */
        .mobile-container::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Header */
        .header {
            width: 100%;
            padding: 40px 20px 20px;
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            text-align: center;
            grid-column: 2;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            color: var(--text-main);
            grid-column: 1;
        }

        .back-btn:active {
            background: rgba(0,0,0,0.05);
        }

        html[dir="rtl"] .back-icon {
            transform: rotate(180deg);
        }

        /* Content Area */
        .content {
            padding: 24px 20px 40px; /* Added independent top vertical spacing */
            flex-grow: 1;
            width: 100%;
        }

        /* User Profile Card */
        .profile-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--accent-bg);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-inline-end: 16px;
            flex-shrink: 0;
        }

        .profile-info {
            flex-grow: 1;
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .profile-email {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Section Header */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            margin-top: 28px;
            padding-inline-start: 4px;
        }

        /* Cards Grouping */
        .card-group {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* List Items */
        .list-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:active {
            background-color: var(--item-hover);
        }

        .item-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--accent-bg);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-inline-end: 16px;
            flex-shrink: 0;
        }
        
        .item-icon.pref-icon {
            background: var(--icon-bg);
            color: #64748b;
        }

        .item-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .item-value {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-inline-start: 12px;
        }

        .item-action {
            color: #a0aec0;
            display: flex;
            align-items: center;
            margin-inline-start: 16px;
        }

        html[dir="rtl"] .forward-icon {
            transform: rotate(180deg);
        }

        /* Logout button at the bottom */
        .logout-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 32px;
            cursor: pointer;
            padding: 16px;
            background: var(--error-bg);
            border-radius: var(--border-radius);
            color: #e53e3e;
            transition: background 0.2s;
        }
        
        .logout-container:active {
            background: var(--error-active);
        }
        
        .logout-text {
            font-size: 16px;
            font-weight: 700;
            margin-inline-start: 12px;
        }

        /* Media query for mockup mode on larger desktop screens */
        @media (min-width: 481px) {
            body {
                padding: 1.25rem;
            }
            .mobile-container {
                height: 896px;
                max-height: 90vh;
                min-height: auto;
                box-shadow: var(--shadow-md);
                border-radius: 36px;
                border: 10px solid #1a202c;
                margin: auto;
            }
        }

    </style>
</head>
<body>
